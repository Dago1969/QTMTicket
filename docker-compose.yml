version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: qtm_ticket_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: change_me_root
      MYSQL_DATABASE: qtmticket
      MYSQL_USER: qtmuser
      MYSQL_PASSWORD: qtm_pass
    ports:
      - "3307:3306" # map to 3307 on host to avoid conflict with local installs
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
