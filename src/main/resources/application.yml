spring:
  application:
    name: qtm-ticket
  datasource:
    url: jdbc:sqlite:./data/qtmticket.db
    driver-class-name: org.sqlite.JDBC
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.community.dialect.SQLiteDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false

server:
  port: 8086
  servlet:
    context-path: /api/ticket

logging:
  level:
    root: INFO
    com.qtm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
