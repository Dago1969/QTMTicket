# Application identity populated at build time by Maven resource filtering
application:
  title: ${project.name}
  version: ${project.version}
spring:
  application:
    name: qtm-ticket
  datasource:
    # Environment placeholders (can be overridden with environment variables or a .env file)
    # DB_HOST: database host (default: localhost)
    # DB_PORT: database port (default: 3306)
    # DB_NAME: database/schema name (default: qtmticket)
    # DB_USERNAME: database user (default: root)
    # DB_PASSWORD: database password (default: change_me)
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:qtmticket}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:change_me}}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 10
        order_inserts: true
        order_updates: true
  liquibase:
    change-log: classpath:/db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: false
    default-schema: ${DB_NAME:qtmticket}
  servlet:
    multipart:
      max-file-size: ${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:50MB}
      max-request-size: ${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:50MB}

server:
  port: 8084
  servlet:
    context-path: /api/ticket

logging:
  file:
    name: /opt/qtm/QtmTicket/logs/qtm-ticket.log  # <--- Percorso completo + nome file
  level:
    root: INFO
    com.qtm: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
