databaseChangeLog:
  - changeSet:
      id: 20260915-01-add-asl-provinceid
      author: copilot
      preConditions:
        - onFail: MARK_RAN
          onError: HALT
          and:
            - tableExists:
                tableName: asl
            - not:
                columnExists:
                  tableName: asl
                  columnName: province_id
      changes:
        - addColumn:
            tableName: asl
            columns:
              - column:
                  name: province_id
                  type: BIGINT
        - sql:
            sql: |
              UPDATE asl a
              JOIN cities c ON a.city_id = c.id
              SET a.province_id = c.province_id
              WHERE a.province_id IS NULL;
        - addForeignKeyConstraint:
            baseTableName: asl
            baseColumnNames: province_id
            referencedTableName: provinces
            referencedColumnNames: id
            constraintName: fk_asl_province
            validate: true