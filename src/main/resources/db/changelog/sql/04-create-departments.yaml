databaseChangeLog:
  - changeSet:
      id: 04-create-departments
      author: copilot
      context: schema
      preConditions:
        - onFail: MARK_RAN
          onError: HALT
          not:
            tableExists: {tableName: departments}
      changes:
        - createTable:
            tableName: departments
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: area_funzionale, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: reparto, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: main_responsibilities, type: TEXT}
              - column: {name: example_symptoms, type: TEXT}
              - column: {name: emergenza_urgenza, type: BOOLEAN}
              - column: {name: notes, type: TEXT}
              - column: {name: created_at, type: DATETIME, constraints: {nullable: false}}
              - column: {name: updated_at, type: DATETIME, constraints: {nullable: false}}
      rollback:
        - dropTable: {tableName: departments, cascadeConstraints: true}
