databaseChangeLog:
  - changeSet:
      id: 11-create-hospital
      author: copilot
      context: schema
      preConditions:
        - onFail: MARK_RAN
          onError: HALT
          not:
            tableExists: {tableName: hospital}
      changes:
        - createTable:
            tableName: hospital
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: anno, type: INT}
              - column: {name: codice_regione, type: VARCHAR(10)}
              - column: {name: regione, type: VARCHAR(200)}
              - column: {name: codice_asl, type: VARCHAR(50)}
              - column: {name: asl, type: VARCHAR(200)}
              - column: {name: codice_struttura, type: VARCHAR(50)}
              - column: {name: struttura, type: VARCHAR(500)}
              - column: {name: comune, type: VARCHAR(200)}
              - column: {name: sigla_provincia, type: VARCHAR(20)}
              - column: {name: indirizzo, type: VARCHAR(500)}
              - column: {name: tipo_struttura, type: VARCHAR(200)}
              - column: {name: hospital_type_id, type: BIGINT}
              - column: {name: asl_id, type: BIGINT}
              - column: {name: city_id, type: BIGINT}
        - addUniqueConstraint:
            tableName: hospital
            columnNames: codice_asl, codice_struttura
            constraintName: uq_hospital_codice_asl_codice_struttura
        - addForeignKeyConstraint:
            baseTableName: hospital
            baseColumnNames: hospital_type_id
            referencedTableName: hospital_type
            referencedColumnNames: id
            constraintName: fk_hospital_hospital_type
        - addForeignKeyConstraint:
            baseTableName: hospital
            baseColumnNames: asl_id
            referencedTableName: asl
            referencedColumnNames: id
            constraintName: fk_hospital_asl
        - addForeignKeyConstraint:
            baseTableName: hospital
            baseColumnNames: city_id
            referencedTableName: cities
            referencedColumnNames: id
            constraintName: fk_hospital_city
      rollback:
        - dropTable: {tableName: hospital, cascadeConstraints: true}
