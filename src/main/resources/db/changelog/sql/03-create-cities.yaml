databaseChangeLog:
  - changeSet:
      id: 03-create-cities
      author: copilot
      context: schema
      preConditions:
        - onFail: MARK_RAN
          onError: HALT
          not:
            tableExists: {tableName: cities}
      changes:
        - createTable:
            tableName: cities
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: code, type: VARCHAR(20), constraints: {nullable: false, unique: true}}
              - column: {name: istat_code, type: VARCHAR(20)}
              - column: {name: catastale_code, type: VARCHAR(20)}
              - column: {name: name, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: is_capoluogo, type: BOOLEAN}
              - column: {name: province_id, type: BIGINT, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: cities
            baseColumnNames: province_id
            referencedTableName: provinces
            referencedColumnNames: id
            constraintName: fk_cities_province
      rollback:
        - dropTable: {tableName: cities, cascadeConstraints: true}
