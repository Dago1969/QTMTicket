databaseChangeLog:
  - changeSet:
      id: 01-create-regions
      author: copilot
      context: schema
      preConditions:
        - onFail: MARK_RAN
          onError: HALT
          not:
            tableExists:
              tableName: regions
      changes:
        - createTable:
            tableName: regions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints: {primaryKey: true, nullable: false}
              - column:
                  name: code
                  type: VARCHAR(10)
                  constraints: {nullable: false, unique: true}
              - column: {name: name, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: geographic_area, type: VARCHAR(100)}
              - column: {name: region_type, type: VARCHAR(100)}
      rollback:
        - dropTable: {tableName: regions, cascadeConstraints: true}
