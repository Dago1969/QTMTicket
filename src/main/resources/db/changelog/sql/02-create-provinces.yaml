databaseChangeLog:
  - changeSet:
      id: 02-create-provinces
      author: copilot
      context: schema
      preConditions:
        - onFail: MARK_RAN
          onError: HALT
          not:
            tableExists: {tableName: provinces}
      changes:
        - createTable:
            tableName: provinces
            columns:
              - column: {name: id, type: BIGINT, autoIncrement: true, constraints: {primaryKey: true, nullable: false}}
              - column: {name: code, type: VARCHAR(10), constraints: {nullable: false, unique: true}}
              - column: {name: name, type: VARCHAR(200), constraints: {nullable: false}}
              - column: {name: sigla, type: VARCHAR(10)}
              - column: {name: region_id, type: BIGINT, constraints: {nullable: false}}
        - addForeignKeyConstraint:
            baseTableName: provinces
            baseColumnNames: region_id
            referencedTableName: regions
            referencedColumnNames: id
            constraintName: fk_provinces_region
      rollback:
        - dropTable: {tableName: provinces, cascadeConstraints: true}
