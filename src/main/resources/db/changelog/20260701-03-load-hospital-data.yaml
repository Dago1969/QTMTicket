databaseChangeLog:
  - changeSet:
      id: 20260701-03-load-hospital-data
      author: copilot
      runAlways: true
      preConditions:
        - onFail: HALT
          onError: HALT
        - tableExists:
            tableName: hospital
        - tableExists:
            tableName: hospital_type
        - tableExists:
            tableName: asl
      changes:
        - sql:
            splitStatements: false
            endDelimiter: ";"
            sql: |
              DROP TABLE IF EXISTS hospital_staging;
        - createTable:
            tableName: hospital_staging
            columns:
              - column:
                  name: anno
                  type: VARCHAR(10)
              - column:
                  name: codice_regione
                  type: VARCHAR(10)
              - column:
                  name: regione
                  type: VARCHAR(200)
              - column:
                  name: codice_asl
                  type: VARCHAR(50)
              - column:
                  name: asl
                  type: VARCHAR(200)
              - column:
                  name: codice_struttura
                  type: VARCHAR(50)
              - column:
                  name: struttura
                  type: VARCHAR(500)
              - column:
                  name: indirizzo
                  type: VARCHAR(500)
              - column:
                  name: codice_tipo_struttura
                  type: VARCHAR(50)
              - column:
                  name: sottotipo_struttura
                  type: VARCHAR(200)
              - column:
                  name: tipo_struttura
                  type: VARCHAR(200)
              - column:
                  name: comune
                  type: VARCHAR(200)
              - column:
                  name: sigla_provincia
                  type: VARCHAR(20)
              - column:
                  name: codice_disciplina
                  type: VARCHAR(50)
              - column:
                  name: disciplina
                  type: VARCHAR(200)
              - column:
                  name: posti_letto_day_hospital
                  type: VARCHAR(50)
              - column:
                  name: posti_letto_day_surgery
                  type: VARCHAR(50)
              - column:
                  name: posti_letto_degenza_ordinaria
                  type: VARCHAR(50)
              - column:
                  name: posti_letto_utilizzati
                  type: VARCHAR(50)
              - column:
                  name: num_dimessi
                  type: VARCHAR(50)
              - column:
                  name: giornate_degenza
                  type: VARCHAR(50)
              - column:
                  name: giornate_disponibili
                  type: VARCHAR(50)
              - column:
                  name: degenza_media_ordinaria
                  type: VARCHAR(50)
              - column:
                  name: icm
                  type: VARCHAR(50)
              - column:
                  name: tasso_utilizzo
                  type: VARCHAR(50)
        - loadData:
            file: ../../Dati_di_anagrafe_e_di_attività_delle_Strutture_di_Ricovero_Pubbliche_ed_equiparate.csv
            relativeToChangelogFile: true
            encoding: UTF-8
            separator: ';'
            tableName: hospital_staging
            columns:
              - column:
                  header: anno
                  name: anno
              - column:
                  header: codice_regione
                  name: codice_regione
              - column:
                  header: regione
                  name: regione
              - column:
                  header: codice_asl
                  name: codice_asl
              - column:
                  header: asl
                  name: asl
              - column:
                  header: codice_struttura
                  name: codice_struttura
              - column:
                  header: struttura
                  name: struttura
              - column:
                  header: indirizzo
                  name: indirizzo
              - column:
                  header: codice_tipo_struttura
                  name: codice_tipo_struttura
              - column:
                  header: sottotipo_struttura
                  name: sottotipo_struttura
              - column:
                  header: tipo_struttura
                  name: tipo_struttura
              - column:
                  header: comune
                  name: comune
              - column:
                  header: sigla_provincia
                  name: sigla_provincia
        - sql:
            splitStatements: false
            endDelimiter: ";"
            sql: |
              INSERT INTO hospital_type (code, description)
              SELECT DISTINCT TRIM(s.codice_tipo_struttura), TRIM(s.tipo_struttura)
              FROM hospital_staging s
              WHERE TRIM(s.codice_tipo_struttura) IS NOT NULL
                AND TRIM(s.codice_tipo_struttura) <> ''
                AND TRIM(s.tipo_struttura) IS NOT NULL
                AND TRIM(s.tipo_struttura) <> ''
              ON DUPLICATE KEY UPDATE description = VALUES(description);
        - sql:
            splitStatements: false
            endDelimiter: ";"
            sql: |
              INSERT INTO hospital (
                  codice_regione,
                  codice_asl,
                  codice_struttura,
                  struttura,
                  indirizzo,
                  hospital_type_id,
                  asl_id,
                  city_id
              )
              SELECT
                  CASE
                      WHEN LENGTH(TRIM(s.codice_regione)) >= 2 THEN LEFT(TRIM(s.codice_regione), 2)
                      ELSE LPAD(TRIM(s.codice_regione), 2, '0')
                  END AS codice_regione_norm,
                  TRIM(s.codice_asl) AS codice_asl,
                  TRIM(s.codice_struttura) AS codice_struttura,
                  ANY_VALUE(TRIM(s.struttura)) AS struttura,
                  ANY_VALUE(TRIM(s.indirizzo)) AS indirizzo,
                  ANY_VALUE(ht.id) AS hospital_type_id,
                      ANY_VALUE(a.id) AS asl_id,
                      ANY_VALUE(c.id) AS city_id
              FROM hospital_staging s
              LEFT JOIN hospital_type ht ON ht.code = TRIM(s.codice_tipo_struttura)
              LEFT JOIN asl a ON a.codice_azienda = TRIM(s.codice_asl)
               AND a.codice_regione = CASE
                   WHEN LENGTH(TRIM(s.codice_regione)) >= 2 THEN LEFT(TRIM(s.codice_regione), 2)
                   ELSE LPAD(TRIM(s.codice_regione), 2, '0')
               END
                  LEFT JOIN provinces p ON (
                      LOWER(TRIM(p.sigla)) = LOWER(TRIM(s.sigla_provincia))
                      OR LOWER(TRIM(p.name)) LIKE CONCAT('%', LOWER(TRIM(s.sigla_provincia)), '%')
                  )
                  LEFT JOIN cities c ON LOWER(TRIM(c.name)) = LOWER(TRIM(s.comune)) AND c.province_id = p.id
              WHERE TRIM(s.codice_asl) IS NOT NULL
                AND TRIM(s.codice_asl) <> ''
                AND TRIM(s.codice_struttura) IS NOT NULL
                AND TRIM(s.codice_struttura) <> ''
              GROUP BY
                  CASE
                      WHEN LENGTH(TRIM(s.codice_regione)) >= 2 THEN LEFT(TRIM(s.codice_regione), 2)
                      ELSE LPAD(TRIM(s.codice_regione), 2, '0')
                  END,
                  TRIM(s.codice_asl),
                  TRIM(s.codice_struttura)
              ON DUPLICATE KEY UPDATE
                  struttura = VALUES(struttura),
                  indirizzo = VALUES(indirizzo),
                      hospital_type_id = VALUES(hospital_type_id),
                      asl_id = VALUES(asl_id),
                      city_id = VALUES(city_id);
        - sql:
            splitStatements: false
            endDelimiter: ";"
            sql: |
              DROP TABLE IF EXISTS hospital_staging;
