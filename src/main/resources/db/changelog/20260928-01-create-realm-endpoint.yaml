databaseChangeLog:
  - changeSet:
      id: 20260928-01-create-realm-endpoint
      author: copilot
      preConditions:
        - onFail: MARK_RAN
          onError: HALT
          not:
            tableExists:
              tableName: realm_endpoint
      changes:
        - createTable:
            tableName: realm_endpoint
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: realm
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: project
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: base_url
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: realm_endpoint
            columnNames: realm, project
            constraintName: uk_realm_endpoint_realm_project