databaseChangeLog:
  - changeSet:
      id: 20260626-04-load-asl-data
      author: copilot
      runAlways: true
      preConditions:
        - onFail: HALT
          onError: HALT
          tableExists:
            tableName: asl
      changes:
        - sql:
            splitStatements: false
            endDelimiter: ";"
            sql: |
              DROP TABLE IF EXISTS asl_staging;
        - createTable:
            tableName: asl_staging
            columns:
              - column:
                  name: anno
                  type: VARCHAR(10)
              - column:
                  name: codice_regione
                  type: VARCHAR(10)
              - column:
                  name: denominazione_regione
                  type: VARCHAR(200)
              - column:
                  name: codice_azienda
                  type: VARCHAR(50)
              - column:
                  name: denominazione_azienda
                  type: VARCHAR(500)
              - column:
                  name: indirizzo
                  type: VARCHAR(500)
              - column:
                  name: cap
                  type: VARCHAR(20)
              - column:
                  name: comune
                  type: VARCHAR(200)
              - column:
                  name: sigla_provincia
                  type: VARCHAR(20)
              - column:
                  name: telefono
                  type: VARCHAR(100)
              - column:
                  name: fax
                  type: VARCHAR(100)
              - column:
                  name: email
                  type: VARCHAR(200)
              - column:
                  name: sito_web
                  type: VARCHAR(200)
              - column:
                  name: partita_iva
                  type: VARCHAR(50)
        - loadData:
            file: classpath:ASL_2010-2026.csv
            relativeToChangelogFile: false
            encoding: UTF-8
            separator: ';'
            tableName: asl_staging
            columns:
              - column:
                  header: ANNO
                  name: anno
              - column:
                  header: CODICE REGIONE
                  name: codice_regione
              - column:
                  header: DENOMINAZIONE REGIONE
                  name: denominazione_regione
              - column:
                  header: CODICE AZIENDA
                  name: codice_azienda
              - column:
                  header: DENOMINAZIONE AZIENDA
                  name: denominazione_azienda
              - column:
                  header: INDIRIZZO
                  name: indirizzo
              - column:
                  header: CAP
                  name: cap
              - column:
                  header: COMUNE
                  name: comune
              - column:
                  header: SIGLA PROVINCIA
                  name: sigla_provincia
              - column:
                  header: TELEFONO
                  name: telefono
              - column:
                  header: FAX
                  name: fax
              - column:
                  header: E-MAIL
                  name: email
              - column:
                  header: SITO WEB
                  name: sito_web
              - column:
                  header: PARTITA IVA
                  name: partita_iva
        - sql:
            splitStatements: false
            endDelimiter: ";"
            sql: |
              INSERT INTO asl (codice_regione, codice_azienda, denominazione_azienda, city_id, indirizzo, cap, telefono, fax, email, sito_web, partita_iva)
              SELECT
                TRIM(r.code),
                s.codice_azienda,
                s.denominazione_azienda,
                c.id,
                TRIM(s.indirizzo),
                s.cap,
                TRIM(s.telefono),
                TRIM(s.fax),
                TRIM(s.email),
                TRIM(s.sito_web),
                TRIM(s.partita_iva)
              FROM (
                SELECT * FROM (
                  SELECT s.*, ROW_NUMBER() OVER (
                    PARTITION BY s.denominazione_regione, s.codice_azienda
                    ORDER BY CAST(s.anno AS UNSIGNED) DESC
                  ) rn
                  FROM asl_staging s
                ) ranked
                WHERE ranked.rn = 1
              ) s
              JOIN regions r ON TRIM(UPPER(r.name)) = TRIM(UPPER(s.denominazione_regione))
              LEFT JOIN cities c ON c.name = TRIM(s.comune) AND c.province_id = (
                SELECT p.id FROM provinces p WHERE p.sigla = TRIM(s.sigla_provincia) ORDER BY p.id LIMIT 1
              )
              ON DUPLICATE KEY UPDATE
                denominazione_azienda = VALUES(denominazione_azienda),
                city_id = VALUES(city_id),
                indirizzo = VALUES(indirizzo),
                cap = VALUES(cap),
                telefono = VALUES(telefono),
                fax = VALUES(fax),
                email = VALUES(email),
                sito_web = VALUES(sito_web),
                partita_iva = VALUES(partita_iva);
        - sql:
            splitStatements: false
            endDelimiter: ";"
            sql: |
              DROP TABLE IF EXISTS asl_staging;
