databaseChangeLog:
  - changeSet:
      id: 20260702-01-add-hospital-cityid
      author: copilot
      runAlways: false
      preConditions:
        - onFail: MARK_RAN
          onError: HALT
          tableExists:
            tableName: hospital
      changes:
        - sql:
            dbms: mariadb,mysql
            splitStatements: false
            endDelimiter: ";"
            sql: |
              ALTER TABLE hospital ADD COLUMN IF NOT EXISTS city_id BIGINT NULL;
              SET @fk_exists = (
                SELECT COUNT(*)
                FROM information_schema.TABLE_CONSTRAINTS
                WHERE CONSTRAINT_SCHEMA = DATABASE()
                  AND TABLE_NAME = 'hospital'
                  AND CONSTRAINT_NAME = 'fk_hospital_city'
                  AND CONSTRAINT_TYPE = 'FOREIGN KEY'
              );
              SET @fk_sql = IF(
                @fk_exists = 0,
                'ALTER TABLE hospital ADD CONSTRAINT fk_hospital_city FOREIGN KEY (city_id) REFERENCES cities (id)',
                'SELECT 1'
              );
              PREPARE fk_statement FROM @fk_sql;
              EXECUTE fk_statement;
              DEALLOCATE PREPARE fk_statement;
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: hospital
            constraintName: fk_hospital_city
        - dropColumn:
            columnName: city_id
            tableName: hospital
