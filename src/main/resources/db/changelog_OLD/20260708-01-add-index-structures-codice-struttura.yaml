      preConditions:
        - onFail: MARK_RAN
          onError: HALT
          not:
            indexExists:
              tableName: structures
              indexName: idx_structures_codice_struttura
      changes:
        - createIndex:
            tableName: structures
            indexName: idx_structures_codice_struttura
