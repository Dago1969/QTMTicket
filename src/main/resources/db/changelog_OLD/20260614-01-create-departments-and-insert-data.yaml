databaseChangeLog:
  - changeSet:
      id: 20260614-01-create-departments-and-insert-data
      author: copilot
      preConditions:
        - onFail: MARK_RAN
          onError: HALT
          not:
            tableExists:
              tableName: departments
      changes:
        - createTable:
            tableName: departments
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: area_funzionale
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: reparto
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: main_responsibilities
                  type: TEXT
              - column:
                  name: example_symptoms
                  type: TEXT
              - column:
                  name: emergenza_urgenza
                  type: BOOLEAN
              - column:
                  name: notes
                  type: TEXT
              - column:
                  name: created_at
                  type: DATETIME
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: DATETIME
                  constraints:
                    nullable: false

        - addNotNullConstraint:
            tableName: departments
            columnName: created_at
            columnDataType: DATETIME
        - addNotNullConstraint:
            tableName: departments
            columnName: updated_at
            columnDataType: DATETIME

        - insert:
            tableName: departments
            columns:
              - column:
                  name: area_funzionale
                  value: "Emergenza e Urgenza"
              - column:
                  name: reparto
                  value: "Pronto Soccorso (PS)"
              - column:
